[project]
name = "virtual-league-collector"
version = "0.1.0"
description = "A production-quality data collection system for a virtual football betting research project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.42.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "tenacity>=8.2.3",
    "orjson>=3.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "isort>=5.13.2"
]

[tool.setuptools.packages.find]
include = ["app*"]
